name: Update korikosmos.dev

# korikosmos.dev serves its own copy of the game at /games/bounty-office/.
# On every push to main, ask it to re-sync to this commit; its
# sync-bounty-office workflow copies the files in and redeploys.
#
# Needs a SITE_DISPATCH_TOKEN secret: a fine-grained personal access token
# scoped to KoriKosmos/korikosmos.dev only, with "Contents: Read and write"
# (the permission GitHub requires for repository_dispatch). Without it the job
# skips with a warning, and the site still catches up on its daily sync.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Tell korikosmos.dev to sync
        env:
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::SITE_DISPATCH_TOKEN is not set; korikosmos.dev will pick this up on its daily sync."
            exit 0
          fi
          gh api repos/KoriKosmos/korikosmos.dev/dispatches \
            -f event_type=bounty-office-updated \
            -f "client_payload[sha]=$GITHUB_SHA"
          echo "Asked korikosmos.dev to sync to $GITHUB_SHA"
